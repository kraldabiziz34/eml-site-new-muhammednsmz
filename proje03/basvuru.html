<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mars Projesi - Başvuru</title>

    <link rel="stylesheet" href="marstyle.css">
</head>

<body>

<div class="ana-menu-bar">
    <a class="ana-menu-btn" href="../index.html">&#8592; ANA MENU</a>
</div>

    <header>
        <h1>🧑‍🚀 Bize Katılın</h1>

        <p>
            Mars projesine katılmak için formu doldur.
        </p>
    </header>

    <nav>
        <a href="mars.html">Ana Sayfa</a>
        <a href="galeri.html">Galeri</a>
        <a href="basvuru.html">Bize Katılın</a>
    </nav>

    <main>

        <section class="form-karti">

            <h2>🚀 Başvuru Formu</h2>

            <form>

                <label for="ad">
                    Adınız:
                </label>

                <input
                    type="text"
                    id="ad"
                    name="ad"
                    placeholder="Adınızı yazın"
                    required
                >

                <label for="email">
                    E-posta:
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="E-posta adresinizi yazın"
                    required
                >

                <label for="mesaj">
                    Neden Mars projesine katılmak istiyorsunuz?
                </label>

                <textarea
                    id="mesaj"
                    name="mesaj"
                    rows="5"
                    placeholder="Mesajınızı yazın"
                ></textarea>

                <button type="submit">
                    Başvuruyu Gönder 🚀
                </button>

            </form>

        </section>

    </main>

    <footer>
        <p>🚀 Mars Projesi</p>
    </footer>

</body>

</html>
