
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sepetim ve Ödeme | TechStore</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700;900&display=swap"
        rel="stylesheet"
    >
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1 class="logo">⚡ Tech<span>Store</span></h1>

        <nav>
            <a href="index.html">⬅ Alışverişe Dön</a>
            <a href="sepet.html" class="sepet-buton aktif">
                🛒 Sepetim (<span id="sepetSayaci">0</span>)
            </a>
        </nav>
    </header>

    <main class="sepet-sayfasi-ikiye-bol">

        <!-- SOL TARAF: SEPET TABLOSU -->
        <section class="sepet-tablo-alani">
            <h2>Alışveriş Sepetiniz</h2>

            <table>
                <thead>
                    <tr>
                        <th>Ürün Görseli</th>
                        <th>Ürün Adı</th>
                        <th>Marka</th>
                        <th>Fiyat</th>
                        <th>İşlem</th>
                    </tr>
                </thead>

                <tbody id="sepetTabloGovdesi">
                    <!-- Ürünler JavaScript ile eklenecek -->
                </tbody>

                <tfoot>
                    <tr>
                        <td colspan="3" style="text-align:right; font-weight:bold;">
                            ÜRÜNLER TOPLAMI:
                        </td>
                        <td colspan="2" id="araToplamAlani">₺0,00</td>
                    </tr>

                    <tr>
                        <td colspan="3" style="text-align:right; font-weight:bold;">
                            KARGO:
                        </td>
                        <td colspan="2" id="kargoTutariAlani">₺0,00</td>
                    </tr>

                    <tr>
                        <td colspan="3" style="text-align:right; font-weight:bold;">
                            İNDİRİM:
                        </td>
                        <td colspan="2" id="indirimTutariAlani">₺0,00</td>
                    </tr>

                    <tr>
                        <td colspan="3" style="text-align:right; font-weight:bold;">
                            GENEL TOPLAM:
                        </td>
                        <td
                            colspan="2"
                            id="toplamTutarAlani"
                            class="toplam-fiyat"
                        >
                            ₺0,00
                        </td>
                    </tr>
                </tfoot>
            </table>

            <!-- İNDİRİM KUPONU -->
            <div class="form-grup" style="margin-top:20px;">
                <label for="kuponKodu">İndirim Kuponu:</label>

                <div style="display:flex; gap:10px; flex-wrap:wrap;">
                    <input
                        type="text"
                        id="kuponKodu"
                        placeholder="İndirim Kodu"
                        autocomplete="off"
                    >

                    <button
                        type="button"
                        onclick="kuponUygula()"
                        class="kat-btn"
                    >
                        🎟️ Uygula
                    </button>
                </div>

                <p
                    id="kuponMesaji"
                    role="status"
                    aria-live="polite"
                ></p>
            </div>

            <button
                type="button"
                onclick="sepetiBosalt()"
                class="temizle-btn"
            >
                🗑️ Sepeti Tamamen Boşalt
            </button>
        </section>

        <!-- SAĞ TARAF: ÖDEME FORMU -->
        <aside class="odeme-form-alani">

            <form id="odemeFormu" onsubmit="siparisiTamamla(event)">
                <fieldset>
                    <legend>💳 Güvenli Ödeme</legend>

                    <div class="form-grup">
                        <label for="musteriAd">
                            Ad Soyad (Kart Üzerindeki):
                        </label>

                        <input
                            type="text"
                            id="musteriAd"
                            name="musteriAd"
                            required
                            placeholder="Örn: Engin Emiroğlu"
                        >
                    </div>

                    <div class="form-grup">
                        <label for="adres">Teslimat Adresi:</label>

                        <textarea
                            id="adres"
                            name="adres"
                            rows="2"
                            required
                            placeholder="Mahalle, Sokak, İl/İlçe..."
                        ></textarea>
                    </div>

                    <div class="form-grup">
                        <label for="kartNo">
                            Kredi Kartı Numarası (16 Hane):
                        </label>

                        <input
                            type="text"
                            id="kartNo"
                            name="kartNo"
                            required
                            pattern="[0-9]{16}"
                            maxlength="16"
                            inputmode="numeric"
                            autocomplete="cc-number"
                            title="Lütfen 16 haneli kart numaranızı boşluksuz giriniz."
                            placeholder="1234123412341234"
                        >
                    </div>

                    <div class="yan-yana-input">

                        <div class="form-grup">
                            <label for="sonKullanma">
                                Son Kullanma (AA/YY):
                            </label>

                            <input
                                type="text"
                                id="sonKullanma"
                                name="sonKullanma"
                                required
                                pattern="[0-9]{2}/[0-9]{2}"
                                maxlength="5"
                                inputmode="numeric"
                                autocomplete="cc-exp"
                                title="Son kullanma tarihini AA/YY biçiminde giriniz. Örn: 08/28"
                                placeholder="08/28"
                            >
                        </div>

                        <div class="form-grup">
                            <label for="cvv">CVV (3 Hane):</label>

                            <input
                                type="password"
                                id="cvv"
                                name="cvv"
                                required
                                pattern="[0-9]{3}"
                                maxlength="3"
                                inputmode="numeric"
                                autocomplete="cc-csc"
                                title="CVV kodu 3 rakamdan oluşmalıdır."
                                placeholder="123"
                            >
                        </div>

                    </div>

                    <button type="submit" class="satinal-btn">
                        ✅ SİPARİŞİ TAMAMLA
                    </button>

                </fieldset>
            </form>
        </aside>

    </main>

    <script src="app.js"></script>
</body>
</html>
