<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Mario</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="ana-menu-bar">
    <a class="ana-menu-btn" href="../index.html">&#8592; ANA MENU</a>
</div>

<div class="game-container">

    <h1 class="game-title">SUPER MARIO</h1>

    <div class="game-screen">

        <div class="game-info">
            <div>SKOR: <span id="score">0</span></div>
            <div>COIN: <span id="coins">0</span></div>
            <div>CAN: <span id="lives">3</span></div>
            <div>SÜRE: <span id="time">120</span></div>
        </div>

        <div class="mario-board">

            <canvas id="game" width="900" height="500"></canvas>

            <div id="gameMessage" class="game-message">

                <h2 id="messageTitle">SUPER MARIO</h2>

                <p id="messageText">
                    Oyuna başlamak için bir tuşa bas.
                </p>

                <button id="startButton">
                    OYUNA BAŞLA
                </button>

            </div>

        </div>

        <div class="controls">
            ← → Hareket &nbsp; | &nbsp;
            ↑ Zıpla &nbsp; | &nbsp;
            SPACE Zıpla
        </div>

        <button onclick="restartGame()" class="restart-button">
            ↻ YENİDEN BAŞLAT
        </button>

    </div>

    <a href="retro.html" class="back-button">
        ← Oyunlara Dön
    </a>

</div>

<script>

"use strict";

/* =========================
   CANVAS
========================= */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const WIDTH = canvas.width;
const HEIGHT = canvas.height;


/* =========================
   OYUN DEĞİŞKENLERİ
========================= */

let score = 0;
let coins = 0;
let lives = 3;

let gameStarted = false;
let gameOver = false;
let gameWon = false;

let cameraX = 0;

let levelTime = 120;
let timerInterval = null;


/* =========================
   TUŞLAR
========================= */

const keys = {};

document.addEventListener("keydown", function(e) {

    keys[e.key] = true;

    if (
        e.key === "ArrowLeft" ||
        e.key === "ArrowRight" ||
        e.key === "ArrowUp" ||
        e.code === "Space"
    ) {
        e.preventDefault();
    }

    if (
        (e.key === "ArrowUp" || e.code === "Space") &&
        !mario.jumping &&
        gameStarted &&
        !gameOver
    ) {

        mario.velocityY = -14;
        mario.jumping = true;

        playSound(500, 0.08);

    }

    if (e.key.toLowerCase() === "p") {
        togglePause();
    }

});

document.addEventListener("keyup", function(e) {
    keys[e.key] = false;
});


/* =========================
   MARIO
========================= */

const mario = {

    x: 100,
    y: 300,

    width: 34,
    height: 50,

    velocityX: 0,
    velocityY: 0,

    speed: 5,
    jumpPower: 14,

    jumping: false,

    direction: 1

};


/* =========================
   FİZİK
========================= */

const gravity = 0.65;


/* =========================
   DÜNYA
========================= */

const worldWidth = 5000;

const groundY = 430;


/* =========================
   PLATFORM SINIFLARI
========================= */

const platforms = [

    {x: 0, y: 430, width: 800, height: 70},
    {x: 900, y: 430, width: 700, height: 70},
    {x: 1700, y: 430, width: 900, height: 70},
    {x: 2700, y: 430, width: 800, height: 70},
    {x: 3600, y: 430, width: 1400, height: 70},

    {x: 350, y: 340, width: 130, height: 25},
    {x: 600, y: 280, width: 130, height: 25},

    {x: 1050, y: 330, width: 140, height: 25},
    {x: 1300, y: 260, width: 140, height: 25},

    {x: 1850, y: 340, width: 130, height: 25},
    {x: 2100, y: 280, width: 140, height: 25},
    {x: 2400, y: 220, width: 140, height: 25},

    {x: 2850, y: 330, width: 130, height: 25},
    {x: 3150, y: 270, width: 150, height: 25},

    {x: 3750, y: 340, width: 150, height: 25},
    {x: 4100, y: 280, width: 150, height: 25},
    {x: 4450, y: 340, width: 150, height: 25}

];


/* =========================
   COINLER
========================= */

const coinObjects = [

    {x: 380, y: 300, collected: false},
    {x: 430, y: 300, collected: false},

    {x: 630, y: 240, collected: false},
    {x: 680, y: 240, collected: false},

    {x: 1080, y: 290, collected: false},
    {x: 1130, y: 290, collected: false},

    {x: 1330, y: 220, collected: false},

    {x: 1880, y: 300, collected: false},
    {x: 1930, y: 300, collected: false},

    {x: 2130, y: 240, collected: false},

    {x: 2430, y: 180, collected: false},

    {x: 2880, y: 290, collected: false},
    {x: 2930, y: 290, collected: false},

    {x: 3180, y: 230, collected: false},

    {x: 3780, y: 300, collected: false},
    {x: 3830, y: 300, collected: false},

    {x: 4130, y: 240, collected: false},

    {x: 4480, y: 300, collected: false},
    {x: 4530, y: 300, collected: false}

];


/* =========================
   SORU BLOKLARI
========================= */

const questionBlocks = [

    {x: 280, y: 300, hit: false},
    {x: 520, y: 220, hit: false},

    {x: 1000, y: 290, hit: false},
    {x: 1250, y: 220, hit: false},

    {x: 1800, y: 300, hit: false},
    {x: 2050, y: 240, hit: false},

    {x: 2800, y: 290, hit: false},
    {x: 3100, y: 230, hit: false}

];


/* =========================
   DÜŞMANLAR
========================= */

const enemies = [

    {
        x: 700,
        y: 390,
        width: 35,
        height: 40,
        speed: 1.2,
        direction: 1,
        alive: true
    },

    {
        x: 1200,
        y: 390,
        width: 35,
        height: 40,
        speed: 1.5,
        direction: -1,
        alive: true
    },

    {
        x: 1950,
        y: 390,
        width: 35,
        height: 40,
        speed: 1.3,
        direction: 1,
        alive: true
    },

    {
        x: 2500,
        y: 390,
        width: 35,
        height: 40,
        speed: 1.5,
        direction: -1,
        alive: true
    },

    {
        x: 3000,
        y: 390,
        width: 35,
        height: 40,
        speed: 1.4,
        direction: 1,
        alive: true
    },

    {
        x: 4200,
        y: 390,
        width: 35,
        height: 40,
        speed: 1.6,
        direction: -1,
        alive: true
    }

];


/* =========================
   BAYRAK
========================= */

const flag = {

    x: 4700,
    y: 250,
    width: 20,
    height: 180

};


/* =========================
   ÇARPIŞMA
========================= */

function isColliding(a, b) {

    return (

        a.x < b.x + b.width &&
        a.x + a.width > b.x &&
        a.y < b.y + b.height &&
        a.y + a.height > b.y

    );

}


/* =========================
   MARIO UPDATE
========================= */

function updateMario() {

    if (!gameStarted || gameOver || gameWon) {
        return;
    }


    /* HAREKET */

    mario.velocityX = 0;

    if (keys["ArrowLeft"]) {

        mario.velocityX = -mario.speed;
        mario.direction = -1;

    }

    if (keys["ArrowRight"]) {

        mario.velocityX = mario.speed;
        mario.direction = 1;

    }

    mario.x += mario.velocityX;


    /* YATAY SINIR */

    if (mario.x < 0) {
        mario.x = 0;
    }

    if (mario.x > worldWidth - mario.width) {
        mario.x = worldWidth - mario.width;
    }


    /* YERÇEKİMİ */

    mario.velocityY += gravity;

    mario.y += mario.velocityY;


    let onPlatform = false;


    /* PLATFORM ÇARPIŞMASI */

    for (const platform of platforms) {

        if (

            mario.x + mario.width > platform.x &&
            mario.x < platform.x + platform.width &&
            mario.y + mario.height <= platform.y + 15 &&
            mario.y + mario.height + mario.velocityY >= platform.y

        ) {

            mario.y = platform.y - mario.height;

            mario.velocityY = 0;

            mario.jumping = false;

            onPlatform = true;

        }

    }


    /* HARİTADAN DÜŞME */

    if (mario.y > HEIGHT + 100) {

        loseLife();

    }


    /* KAMERA */

    cameraX = mario.x - 250;

    if (cameraX < 0) {
        cameraX = 0;
    }

    if (cameraX > worldWidth - WIDTH) {
        cameraX = worldWidth - WIDTH;
    }

}


/* =========================
   DÜŞMAN UPDATE
========================= */

function updateEnemies() {

    for (const enemy of enemies) {

        if (!enemy.alive) {
            continue;
        }

        enemy.x += enemy.speed * enemy.direction;


        /* GERİ DÖN */

        if (enemy.x < 50) {
            enemy.direction = 1;
        }

        if (enemy.x > worldWidth - 100) {
            enemy.direction = -1;
        }


        /* MARIO ÇARPIŞMASI */

        if (isColliding(mario, enemy)) {

            if (
                mario.velocityY > 0 &&
                mario.y + mario.height - 10 < enemy.y + 20
            ) {

                enemy.alive = false;

                mario.velocityY = -9;

                score += 200;

                playSound(700, 0.1);

            } else {

                loseLife();

            }

        }

    }

}


/* =========================
   COINLER
========================= */

function updateCoins() {

    for (const coin of coinObjects) {

        if (coin.collected) {
            continue;
        }

        const coinBox = {

            x: coin.x - 10,
            y: coin.y - 10,
            width: 20,
            height: 20

        };

        if (isColliding(mario, coinBox)) {

            coin.collected = true;

            coins++;

            score += 100;

            updateUI();

            playSound(900, 0.08);

        }

    }

}


/* =========================
   SORU BLOKLARI
========================= */

function updateQuestionBlocks() {

    for (const block of questionBlocks) {

        if (block.hit) {
            continue;
        }

        const blockBox = {

            x: block.x,
            y: block.y,
            width: 40,
            height: 40

        };


        /* ALTINDAN VURMA */

        if (

            mario.x + mario.width > blockBox.x &&
            mario.x < blockBox.x + blockBox.width &&
            mario.y < blockBox.y + blockBox.height &&
            mario.y + mario.height > blockBox.y &&
            mario.velocityY < 0

        ) {

            block.hit = true;

            score += 100;

            updateUI();

            playSound(800, 0.1);

            mario.velocityY = 2;

        }

    }

}


/* =========================
   BAYRAK
========================= */

function checkFlag() {

    const flagBox = {

        x: flag.x,
        y: flag.y,
        width: 50,
        height: flag.height

    };

    if (isColliding(mario, flagBox)) {

        winGame();

    }

}


/* =========================
   CAN KAYBETME
========================= */

function loseLife() {

    if (gameOver || gameWon) {
        return;
    }

    lives--;

    updateUI();

    playSound(150, 0.3);


    if (lives <= 0) {

        endGame();

        return;

    }


    /* MARIO'YU BAŞLANGICA GÖNDER */

    mario.x = Math.max(50, mario.x - 250);

    mario.y = 200;

    mario.velocityX = 0;

    mario.velocityY = 0;

    mario.jumping = false;

}


/* =========================
   KAZANMA
========================= */

function winGame() {

    gameWon = true;

    gameStarted = false;

    score += levelTime * 10;

    updateUI();

    stopTimer();

    showMessage(

        "BÖLÜM TAMAMLANDI!",

        "Tebrikler! Skorun: " + score,

        "TEKRAR OYNA"

    );

    playSound(1000, 0.3);

}


/* =========================
   GAME OVER
========================= */

function endGame() {

    gameOver = true;

    gameStarted = false;

    stopTimer();

    showMessage(

        "OYUN BİTTİ",

        "Skorun: " + score,

        "TEKRAR OYNA"

    );

}


/* =========================
   ZAMANLAYICI
========================= */

function startTimer() {

    stopTimer();

    timerInterval = setInterval(function() {

        if (!gameStarted || gameOver || gameWon) {
            return;
        }

        levelTime--;

        updateUI();

        if (levelTime <= 0) {

            loseLife();

            levelTime = 120;

            updateUI();

        }

    }, 1000);

}


function stopTimer() {

    if (timerInterval) {

        clearInterval(timerInterval);

        timerInterval = null;

    }

}


/* =========================
   UI
========================= */

function updateUI() {

    document.getElementById("score").textContent = score;

    document.getElementById("coins").textContent = coins;

    document.getElementById("lives").textContent = lives;

    document.getElementById("time").textContent = levelTime;

}


/* =========================
   MESAJ
========================= */

const gameMessage = document.getElementById("gameMessage");
const messageTitle = document.getElementById("messageTitle");
const messageText = document.getElementById("messageText");
const startButton = document.getElementById("startButton");


function showMessage(title, text, buttonText) {

    messageTitle.textContent = title;

    messageText.textContent = text;

    startButton.textContent = buttonText;

    gameMessage.classList.remove("hidden");

}


function hideMessage() {

    gameMessage.classList.add("hidden");

}


/* =========================
   OYUN BAŞLAT
========================= */

function startGame() {

    if (gameOver || gameWon) {

        resetGame();

    }

    gameStarted = true;

    gameOver = false;

    gameWon = false;

    hideMessage();

    startTimer();

}


/* =========================
   PAUSE
========================= */

let paused = false;

function togglePause() {

    if (!gameStarted || gameOver || gameWon) {
        return;
    }

    paused = !paused;

    if (paused) {

        showMessage(

            "DURAKLATILDI",

            "Devam etmek için P tuşuna bas.",

            "DEVAM ET"

        );

    } else {

        hideMessage();

    }

}


/* =========================
   RESET
========================= */

function resetGame() {

    score = 0;

    coins = 0;

    lives = 3;

    levelTime = 120;

    cameraX = 0;

    gameStarted = false;

    gameOver = false;

    gameWon = false;

    paused = false;


    mario.x = 100;

    mario.y = 300;

    mario.velocityX = 0;

    mario.velocityY = 0;

    mario.jumping = false;


    for (const coin of coinObjects) {

        coin.collected = false;

    }


    for (const block of questionBlocks) {

        block.hit = false;

    }


    for (const enemy of enemies) {

        enemy.alive = true;

    }


    updateUI();

    showMessage(

        "SUPER MARIO",

        "Oyuna başlamak için bir tuşa bas.",

        "OYUNA BAŞLA"

    );

}


/* =========================
   DIŞARIDAN RESTART
========================= */

function restartGame() {

    resetGame();

}


/* =========================
   SES
========================= */

let audioContext = null;


function initAudio() {

    if (!audioContext) {

        audioContext = new (

            window.AudioContext ||
            window.webkitAudioContext

        )();

    }

}


function playSound(frequency, duration = 0.1) {

    try {

        initAudio();

        const oscillator =
            audioContext.createOscillator();

        const gain =
            audioContext.createGain();


        oscillator.type = "square";

        oscillator.frequency.value = frequency;


        gain.gain.setValueAtTime(
            0.05,
            audioContext.currentTime
        );


        gain.gain.exponentialRampToValueAtTime(

            0.001,

            audioContext.currentTime + duration

        );


        oscillator.connect(gain);

        gain.connect(audioContext.destination);


        oscillator.start();

        oscillator.stop(

            audioContext.currentTime + duration

        );

    } catch (error) {}

}


/* =========================
   ÇİZİM
========================= */

function drawBackground() {

    /* GÖKYÜZÜ */

    ctx.fillStyle = "#5c94fc";

    ctx.fillRect(

        0,
        0,
        WIDTH,
        HEIGHT

    );


    /* GÜNEŞ */

    ctx.fillStyle = "#ffd700";

    ctx.beginPath();

    ctx.arc(

        750 - cameraX * 0.15,
        80,
        35,
        0,
        Math.PI * 2

    );

    ctx.fill();


    /* BULUTLAR */

    drawCloud(150 - cameraX * 0.25, 90);

    drawCloud(500 - cameraX * 0.25, 130);

    drawCloud(1000 - cameraX * 0.25, 70);

    drawCloud(1600 - cameraX * 0.25, 120);

    drawCloud(2300 - cameraX * 0.25, 80);

    drawCloud(3000 - cameraX * 0.25, 130);

    drawCloud(3800 - cameraX * 0.25, 70);

    drawCloud(4500 - cameraX * 0.25, 120);


    /* UZAK DAĞLAR */

    ctx.fillStyle = "#55aa55";

    for (let x = -200; x < worldWidth; x += 400) {

        const drawX = x - cameraX * 0.4;

        ctx.beginPath();

        ctx.moveTo(drawX, 430);

        ctx.lineTo(drawX + 200, 250);

        ctx.lineTo(drawX + 400, 430);

        ctx.fill();

    }

}


function drawCloud(x, y) {

    ctx.fillStyle = "white";

    ctx.beginPath();

    ctx.arc(x, y, 25, 0, Math.PI * 2);

    ctx.arc(x + 30, y - 15, 30, 0, Math.PI * 2);

    ctx.arc(x + 65, y, 25, 0, Math.PI * 2);

    ctx.fill();

}


/* =========================
   PLATFORM ÇİZ
========================= */

function drawPlatforms() {

    for (const platform of platforms) {

        const x = platform.x - cameraX;

        if (x + platform.width < 0 || x > WIDTH) {
            continue;
        }


        /* ÇİM */

        ctx.fillStyle = "#32a852";

        ctx.fillRect(

            x,
            platform.y,
            platform.width,
            12

        );


        /* TOPRAK */

        ctx.fillStyle = "#9b5a25";

        ctx.fillRect(

            x,
            platform.y + 12,
            platform.width,
            platform.height - 12

        );


        /* TOPRAK DESENİ */

        ctx.fillStyle = "#6d3d18";

        for (

            let brickX = x;

            brickX < x + platform.width;

            brickX += 40

        ) {

            ctx.fillRect(

                brickX,
                platform.y + 25,
                25,
                5

            );

        }

    }

}


/* =========================
   SORU BLOKLARI ÇİZ
========================= */

function drawQuestionBlocks() {

    for (const block of questionBlocks) {

        const x = block.x - cameraX;

        if (x < -50 || x > WIDTH + 50) {
            continue;
        }


        ctx.fillStyle = block.hit
            ? "#8b6b32"
            : "#f5a623";


        ctx.fillRect(

            x,
            block.y,
            40,
            40

        );


        ctx.strokeStyle = "#7a4218";

        ctx.lineWidth = 3;

        ctx.strokeRect(

            x,
            block.y,
            40,
            40

        );


        if (!block.hit) {

            ctx.fillStyle = "white";

            ctx.font = "bold 26px Arial";

            ctx.textAlign = "center";

            ctx.fillText(

                "?",
                x + 20,
                block.y + 29

            );

        }

    }

}


/* =========================
   COIN ÇİZ
========================= */

function drawCoins() {

    for (const coin of coinObjects) {

        if (coin.collected) {
            continue;
        }

        const x = coin.x - cameraX;

        if (x < -30 || x > WIDTH + 30) {
            continue;
        }


        ctx.fillStyle = "#ffd700";

        ctx.beginPath();

        ctx.ellipse(

            x,
            coin.y,
            9,
            13,
            0,
            0,
            Math.PI * 2

        );

        ctx.fill();


        ctx.strokeStyle = "#b8860b";

        ctx.lineWidth = 2;

        ctx.stroke();

    }

}


/* =========================
   DÜŞMAN ÇİZ
========================= */

function drawEnemies() {

    for (const enemy of enemies) {

        if (!enemy.alive) {
            continue;
        }

        const x = enemy.x - cameraX;


        ctx.fillStyle = "#8b4513";

        ctx.beginPath();

        ctx.arc(

            x + 17,
            enemy.y + 20,
            18,
            Math.PI,
            0

        );

        ctx.fill();


        /* GÖZLER */

        ctx.fillStyle = "white";

        ctx.fillRect(

            x + 7,
            enemy.y + 12,
            7,
            8

        );

        ctx.fillRect(

            x + 21,
            enemy.y + 12,
            7,
            8

        );


        ctx.fillStyle = "black";

        ctx.fillRect(

            x + 10,
            enemy.y + 15,
            3,
            4

        );

        ctx.fillRect(

            x + 24,
            enemy.y + 15,
            3,
            4

        );


        /* AYAKLAR */

        ctx.fillStyle = "#5a2d0c";

        ctx.fillRect(

            x,
            enemy.y + 32,
            14,
            8

        );

        ctx.fillRect(

            x + 21,
            enemy.y + 32,
            14,
            8

        );

    }

}


/* =========================
   MARIO ÇİZ
========================= */

function drawMario() {

    const x = mario.x - cameraX;

    const y = mario.y;


    /* ŞAPKA */

    ctx.fillStyle = "#e52521";

    ctx.fillRect(

        x + 5,
        y,
        25,
        9

    );

    ctx.fillRect(

        x,
        y + 7,
        32,
        7

    );


    /* YÜZ */

    ctx.fillStyle = "#ffcc99";

    ctx.fillRect(

        x + 6,
        y + 14,
        24,
        17

    );


    /* SAÇ */

    ctx.fillStyle = "#5b3219";

    ctx.fillRect(

        x + 3,
        y + 13,
        7,
        12

    );

    ctx.fillRect(

        x + 25,
        y + 13,
        6,
        10

    );


    /* GÖZ */

    ctx.fillStyle = "black";

    ctx.fillRect(

        x + 21,
        y + 18,
        3,
        4

    );


    /* BIYIK */

    ctx.fillRect(

        x + 14,
        y + 25,
        13,
        4

    );


    /* GÖVDE */

    ctx.fillStyle = "#e52521";

    ctx.fillRect(

        x + 5,
        y + 31,
        25,
        10

    );


    /* TULUM */

    ctx.fillStyle = "#165dce";

    ctx.fillRect(

        x + 7,
        y + 38,
        21,
        12

    );


    /* KOLLAR */

    ctx.fillStyle = "#e52521";

    ctx.fillRect(

        x,
        y + 32,
        8,
        18

    );

    ctx.fillRect(

        x + 27,
        y + 32,
        8,
        18

    );


    /* AYAKLAR */

    ctx.fillStyle = "#5b3219";

    ctx.fillRect(

        x - 2,
        y + 46,
        15,
        6

    );

    ctx.fillRect(

        x + 21,
        y + 46,
        15,
        6

    );

}


/* =========================
   BAYRAK ÇİZ
========================= */

function drawFlag() {

    const x = flag.x - cameraX;


    ctx.fillStyle = "#555";

    ctx.fillRect(

        x,
        flag.y,
        8,
        flag.height

    );


    ctx.fillStyle = "#32cd32";

    ctx.beginPath();

    ctx.moveTo(x + 8, flag.y);

    ctx.lineTo(x + 65, flag.y + 25);

    ctx.lineTo(x + 8, flag.y + 50);

    ctx.closePath();

    ctx.fill();


    ctx.fillStyle = "#555";

    ctx.fillRect(

        x - 12,
        425,
        35,
        10

    );

}


/* =========================
   ANA DRAW
========================= */

function draw() {

    drawBackground();

    drawPlatforms();

    drawQuestionBlocks();

    drawCoins();

    drawFlag();

    drawEnemies();

    drawMario();

}


/* =========================
   OYUN LOOP
========================= */

function gameLoop() {

    if (!paused) {

        updateMario();

        updateEnemies();

        updateCoins();

        updateQuestionBlocks();

        checkFlag();

    }

    draw();

    requestAnimationFrame(gameLoop);

}


/* =========================
   BAŞLAT BUTONU
========================= */

startButton.addEventListener("click", function() {

    initAudio();

    startGame();

});


/* =========================
   BAŞLANGIÇ
========================= */

resetGame();

gameLoop();

</script>
